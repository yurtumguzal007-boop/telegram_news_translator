services:
  - type: web
    name: telegram-news-translator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: SOURCE_CHANNEL
        value: ajMubasher
      - key: TARGET_CHANNEL
        value: "@DUNYA_NEWS1"
      - key: GEMINI_API_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: CHECK_INTERVAL
        value: "25"
